<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- Apply the saved/system theme BEFORE any CSS paints to avoid a flash.
         Priority: localStorage "leptos-use-color-scheme" > system pref > light. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("leptos-use-color-scheme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "auto") && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)" />
    <!-- static assets, resolved relative to the public-url base -->
    <link rel="icon" href="/verve/verve-7cb6dcd48e14be7b.png" integrity="sha384-yG9XEz2/WkJHKAmsnR7eM6XKMJpqGa6TaHP14h8hhfDvx3PeyreNGQ9gYzP5CA/s"/>
    
    
    
    
    <!-- the WASM app; weak-refs + optimized -->
    
<script type="module">
import init, * as bindings from '/verve/website-4d25b5e511371641.js';
const wasm = await init({ module_or_path: '/verve/website-4d25b5e511371641_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <title>Verve — 原生 GPU 加速研发工作台</title>
    <meta
      name="description"
      content="Verve 是基于 Rust + GPUI 构建的原生、GPU 加速研发工作台，集成接口调试、抓包、服务器排查、压测、Mock、笔记、Hosts 与 JSON 等日常开发工具。"
    />
  <link rel="modulepreload" href="/verve/website-4d25b5e511371641.js" crossorigin="anonymous" integrity="sha384-SXVCCtWE09LVxi0LDcUJVVMwLt7DzN1v77QvMfnG/ttEUtsFNIPID7B5QI6nAVNk"><link rel="preload" href="/verve/website-4d25b5e511371641_bg.wasm" crossorigin="anonymous" integrity="sha384-sVuT1ce7deYf0zzHq6AblTnS88pztLuDVLHywC9IZyKeXeNZ3CPL4bKw4FIbzalC" as="fetch" type="application/wasm"></head>
  <body><script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
